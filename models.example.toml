]

# Pika H3 Flex (Pika-Labs) — 33B text/image-to-video + audio on MiniMax-H3 with LoRA adapters.
# Batch entry (ADR 0018): `up pika-h3-flex --prompt ...` checks sparktwo, stops the serving model
# through the normal fenced stop, runs one pika-h3-pro job on sparktwo detached, and a supervisor
# there restores the previous model when the job ends (done, failed or `batch stop`), Mac or not.
# It is not an OpenAI-compatible server; its ~68 GiB GPU peak cannot share a Spark with Qwen.
# `pull` refuses it (prepared by hand). Runbook: docs/pika-h3-flex.md.
[models.pika-h3-flex]
aliases = ["pika", "pika-h3"]
label = "Pika H3 Flex video + audio"
wrapper = "batch"
# No prepare script: `pull` refuses this unknown recipe before any SSH.
recipe = "pika-h3-flex"
home_node = "worker"
nnodes = 1
hf_id = "Pika-Labs/Pika-H3-Flex"
revision = "0ddf55ad7067ca1e76812253bd7b4600df87f759"
base_model = "MiniMaxAI/MiniMax-H3@42ed227ee7df40d41602854ae760620d6eb651fe"
served_name = ""
image = ""
quant = "BF16"
quant_bits = 16
quant_scope = "all"
quant_detail = "Unquantized BF16: transformer 62 GB, text encoder 63 GB, video VAE 9.8 GB, audio VAE 0.6 GB, FL2VA LoRA 2.6 GB (137 GB on disk)."
modalities = ["text", "image"]
outputs = ["video", "audio"]
gpu_peak_gib = 68
notes = "Batch job on sparktwo only, no API endpoint. 480p/768p, 5–15 s, tasks t2va/i2va/l2va/fl2va/ref2va; only the FL2VA adapter is installed and only t2va is tested. Needs the Spark's GPU to itself: ~68 GiB peak (66.6 GiB allocated while sampling), ~52 GiB host RSS, so it cannot run beside Qwen. 480p 5 s t2va on 2026-11-05: 19 min wall (7.2 min conditioning, 6.5 min transformer load, 1.8 min sampling, 3.2 min decode)."

[models.pika-h3-flex.batch]
workdir = "~/pika-h3-flex"
outputs = "~/pika-h3-flex/outputs"
# {prompt_file} {output} {resolution} {aspect} {duration} {seed} are filled per job.
command = ["~/pika-h3-flex/venv/bin/pika-h3-pro", "--task", "t2va", "--prompt-file", "{prompt_file}",
  "--model-repo", "Pika-Labs/Pika-H3-Flex", "--revision", "0ddf55ad7067ca1e76812253bd7b4600df87f759",
  "--base-path", "~/pika-h3-flex/weights", "--adapter-path", "~/pika-h3-flex/weights/fl2va",
  "--resolution", "{resolution}", "--aspect", "{aspect}", "--duration", "{duration}", "--seed", "{seed}",
  "--output", "{output}"]
path_prepend = ["~/pika-h3-flex/venv/bin", "~/pika-h3-flex/bin"]
unset_env = ["HF_TOKEN"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1", DIFFUSERS_OFFLINE = "1", VIRTUAL_ENV = "~/pika-h3-flex/venv", CPATH = "~/pika-h3-flex/deps/pydev/usr/include", C_INCLUDE_PATH = "~/pika-h3-flex/deps/pydev/usr/include" }
require_paths = ["~/pika-h3-flex/venv/bin/pika-h3-pro", "~/pika-h3-flex/weights/transformer", "~/pika-h3-flex/weights/text_encoder", "~/pika-h3-flex/weights/fl2va/adapter.safetensors", "~/pika-h3-flex/bin/ffmpeg"]
resolutions = ["480p", "768p"]
aspects = ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9", "9:21", "3:2", "2:3", "5:4", "4:5"]
duration_min = 5
duration_max = 15
default_resolution = "480p"
default_aspect = "16:9"
default_duration = 5
default_seed = 42
expected_minutes = 20
timeout_minutes = 120

# AMD Strix Halo boxes: one engine at a time on each through its halo-ctl
# (halo-inference-control); `./spark-serve strix up <id> --box <host>` stops
# the others there. The cluster engine spans both boxes: --box is its master.
[strix]
hosts = ["strix-halo", "strix-halo-2"]   # SSH aliases; also the LAN hostnames clients use
# master = "strix-halo"               # optional: the only box that runs the cluster as master
ctl = "~/.local/bin/halo-ctl"
api_key_file = "~/.config/halogen/api-key"   # read over SSH when needed, never stored here

[strix.models.halo-nemotron35-cluster]
label = "Nemotron 3.5 Super Q8 cluster"
aliases = ["halo-nemotron"]
engine = "cluster"                   # halo-cluster/models.json entry nemotron-3.5-super
served_name = "nemotron-3.5-super"
port = 8081
max_model_len = 1048576              # serve-nemotron35.sh's CTX: the model's native maximum
quant = "Q8_0"
quant_bits = 8
quant_scope = "all"
quant_detail = "ggml-org GGUF Q8_0 (119.65 GiB, one file): experts and the 40 Mamba and 8 attention layers Q8_0; the routers and a few small tensors F32. The MTP draft head is a separate Q8_0 GGUF (3.98 GiB)."
modalities = ["text"]
notes = "llama.cpp b11849 (ROCm) over RPC with the default split by GPU memory; 3 MTP drafts on the master. Text only: the vision projector is not downloaded. Recalled 3 of 3 codes in a 987K-token document (2026-10-24); reading 1M tokens took 2 h 34 min. About 3½ minutes to load."

[strix.models.halo-qwen3-coder-30b]
label = "Qwen3-Coder-30B-A3B Lemonade"
engine = "lemonade"
served_name = "Qwen3-Coder-30B-A3B-Instruct-Q4_K_M"
port = 13305
max_model_len = 262144
max_num_seqs = 1
quant = "Q4_K_M"
quant_bits = 4
quant_scope = "all"
quant_detail = "unsloth GGUF: Q4_K experts and attention, about 16% of expert weights Q6_K."
modalities = ["text"]
notes = "Lemonade 11.8.1, system llama.cpp (ROCm), one request at a time. Factory model."

# Always-on services (ADR 0019): systemd user units on one box, outside
# halo-ctl. Shown with their live health; spark-serve never starts or stops
# them, and runs no halo-ctl up or stop on their box. covers = copies on a
# box's disk that this card stands for, so they show no uncatalogued card.
[strix.models.strix-gpt-oss-120b]
label = "gpt-oss-120b (always on)"
aliases = ["gpt-oss-120b", "strix-llm"]
engine = "service"
box = "strix-halo-2"
unit = "strix-llm.service"
served_name = "gpt-oss-120b"         # the /v1/models id (llama-server --alias)
port = 8080
max_model_len = 131072               # per request: -c 262144 over --parallel 2; /props n_ctx, = n_ctx_train
max_num_seqs = 2
quant = "Q4_K_M"
quant_bits = 4
quant_scope = "all"
quant_detail = "unsloth GGUF labelled Q4_K_M (llama.cpp ftype Q4_K - Medium), 2 files, 62.8 GB: experts MXFP4 as published by OpenAI; attention Q4_K/Q5_0, small Q8_0 layers. 116.8B parameters."
modalities = ["text"]
covers = ["lemonade:gpt-oss-120b-Q4_K_M"]
notes = "llama.cpp b11849 (ROCm) llama-server under systemd (Restart=always, linger), not halo-ctl. OpenAI-compatible on :8080 for the EFI and Pascal newsletters; no API key. 2 slots of 131,072 tokens, --jinja, metrics on. Weights: ~/models/gpt-oss-120b-GGUF, a reflink copy. Added 2026-11-04."

[strix.models.strix-qwen3-embedding]
label = "Qwen3-Embedding-0.6B (always on)"
aliases = ["qwen3-embedding", "strix-embed"]
engine = "service"
box = "strix-halo-2"
unit = "strix-embed.service"
served_name = "qwen3-embedding-0.6b" # the /v1/models id (llama-server --alias)
port = 8081                          # also the cluster's port: no cluster on this box while it runs
max_model_len = 8192                 # per request: -c 16384 over --parallel 2; /props n_ctx
max_num_seqs = 2
quant = "F16"
quant_bits = 16
quant_scope = "all"
quant_detail = "Qwen/Qwen3-Embedding-0.6B model.safetensors converted locally to GGUF f16 (1.2 GB); 596M parameters."
modalities = ["text"]
outputs = ["embeddings"]
embedding_dims = 1024
notes = "llama.cpp b11849 (ROCm) llama-server --embedding --pooling last under systemd (Restart=always, linger), not halo-ctl. OpenAI /v1/embeddings on :8081 for Pascal weekly_00 (replaced text-embedding-3-large); no API key. 1,024-dimension vectors (checked 2026-11-05). Added 2026-11-04."
