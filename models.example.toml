DSV41_EXL3_K_MAP = "/opt/dsv41/exl3_k_map.json"
GLM53_SUPPRESS_STOPS_IN_REASONING = "1"
GLM53_MIXED_PREFILL_CHUNK = "0"
GLM53_SPINWAIT_MS = "stock"
GLM53_DENSE_FP8 = "off"

[models.ds41-exl3.vllm]
args = [
  "--served-model-name", "DeepSeek-v4.1-Flash-EXL3",
  "--host", "0.0.0.0", "--port", "8000",
  "--tensor-parallel-size", "2",
  "--prefix-cache-retention-interval", "4096",
  "--tokenizer-mode", "deepseek_v41",
  "--tool-call-parser", "deepseek_v41",
  "--reasoning-parser", "deepseek_v41",
  "--enable-auto-tool-choice",
  "--enable-prefix-caching",
  "--enable-prompt-tokens-details",
  "--no-enable-flashinfer-autotune",
  "--hf-overrides", '{"engram_table_dir":"/engram-src"}',
  "--quantization", "exl3",
  "--max-model-len", "600000",
  "--gpu-memory-utilization", "0.88",
  "--max-num-seqs", "2",
  "--max-num-batched-tokens", "1536",
  "--kv-cache-memory-bytes", "2684354560",
  "--block-size", "64",
  "--speculative-config", '{"method":"dspark","num_speculative_tokens":3}',
  "--chat-template", "/opt/dsv41/chat_template.jinja",
  "--mm-encoder-tp-mode", "data",
  "--limit-mm-per-prompt", '{"image":100}',
  "--skip-mm-profiling",
]

