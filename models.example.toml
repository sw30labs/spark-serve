aliases = ["superdeepseek", "superdeepseek-abl"]
label = "SuperDeepseek V4 Flash abliterated MQ (Jiunsong, 2x DGX)"
image = "ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8"
recipe = "superdeepseek-abl"
hf_id = "Jiunsong/SuperDeepseek-V4-Flash-abliterated-MQ-2xDGX"
revision = "2a7dd6a12d46f752e290c6255140a42600897864"
serve_path = "/cache/huggingface/hub/models--Jiunsong--SuperDeepseek-V4-Flash-abliterated-MQ-2xDGX/snapshots/2a7dd6a12d46f752e290c6255140a42600897864"
served_name = "SuperDeepseek-V4-Flash-abliterated-MQ-2xDGX"
quant = "FP4 experts + FP8 attn/shared"
quant_bits = 4
quant_scope = "all"
quant_detail = "Routed experts (backbone + 3 MTP layers) FP4 packed as I8 with F8_E8M0 scales per 32; attention, shared experts and indexer FP8 E4M3 128x128 blocks with UE8M0 scales; embeddings, output head (abliteration-recovered overlay), router, norms BF16. Same layout as the official parent; only 46 wo_b pairs and head.weight changed. nvfp4_ds_mla KV."
modalities = ["text"]
wrapper = "vllm"
entry_script = "superdeepseek-abl/entry.sh"
entry_script_sha256 = "c9ab386da20fa5afe7794449cd201cd12312a44b4808d882c1bd214d291405fa"
preflight_script = "superdeepseek-abl/verify.py"
preflight_script_sha256 = "74363826f4f379b962967c6a55661c21fb87815b51b78627389e851458b809bf"
preflight_args = ["/cache/huggingface/hub/models--Jiunsong--SuperDeepseek-V4-Flash-abliterated-MQ-2xDGX/snapshots/2a7dd6a12d46f752e290c6255140a42600897864", "--expected-files", "50", "--expected-index-sha256", "57baa0244cf7679a07758f8aea6045a8eadc2b9a1cac874330382b1014457849", "--expected-encoding-sha256", "abc0d26120250dda0ae077dc64aa28836026e61e970854aaeb792445e6a0dde6"]
container = "vllm_superdeepseek_abl"
nnodes = 2
tensor_parallel = 2
master_port = 25001
hf_mount = "/cache/huggingface"
hf_cache_readonly = true
drop_caches = true
shm_size = "64g"
docker_extra = ["--ulimit", "memlock=-1:-1", "--ulimit", "stack=67108864:67108864"]
ready_timeout = 3600
max_model_len = 1048576
max_num_seqs = 6
gpu_memory_utilization = 0.85
# Hermes stays on its own provider over IPv4: sparkone.local resolves to IPv6 first and vLLM listens on IPv4 only.
hermes_provider = "spark-superds"
hermes_base_url = "http://192.168.1.10:8000/v1"
hermes_context_length = 1048576
host_ip_head = "192.168.100.10"
host_ip_worker = "192.168.100.11"
notes = "ABLITERATED (refusals removed; card: operators responsible for access control). Weight edit of deepseek-ai/DeepSeek-V4-Flash-0731@9e165c30 (48 shards byte-identical to the parent; overlay + head-recovery files override 92 wo_b tensors and head.weight). TP2 over QSFP, DSpark K=1, 1M context, gpu-mem 0.85 (author 0.80; ~4-5 GiB MemAvailable left per node when loaded, fall back to 0.80 if a start OOMs). Measured 2026-11-03 via the local launcher: 8m32s load, ~21 tok/s warm, 2.83M KV tokens. Answers in reasoning mode (DEFAULT_THINKING low)."

