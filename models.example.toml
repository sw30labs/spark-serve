# spark-serve catalog — copy to models.toml and edit [cluster].
# models.toml is gitignored so LAN IPs and SSH hostnames stay off GitHub.
# Cluster fabric is shared. Do not retune NCCL here unless the cable moves.

[cluster]
head = "spark-head"
worker = "spark-worker"
# QSFP / RoCE IP of the head (not the LAN NIC). NVIDIA Spark pairs often use 192.168.100.10.
master_addr = "192.168.100.10"
master_port = 29501
nnodes = 2
# Default --tensor-parallel-size when a model omits the flag.
tensor_parallel = 2
port = 8000
lan_url = "http://192.168.1.10:8000"
hf_cache_host = "/home/YOU/.cache/huggingface"
container = "vllm_cluster"
executor = "mp"
ssh_opts = ["-o", "BatchMode=yes", "-o", "ConnectTimeout=8"]
keep_containers = []
stop_names = ["vllm_cluster"]

[cluster.nccl]
# Right-port QSFP rails (enp1s0f1 / enP2p1s0f1). Do not switch back to f0.
NCCL_IB_DISABLE = "0"
NCCL_IB_HCA = "=rocep1s0f1,roceP2p1s0f1"
NCCL_IB_GID_INDEX = "3"
NCCL_IB_MERGE_NICS = "1"
NCCL_CROSS_NIC = "1"
NCCL_NET_PLUGIN = "none"
NCCL_NET = "IB"
NCCL_SOCKET_IFNAME = "enp1s0f1np1"
GLOO_SOCKET_IFNAME = "enp1s0f1np1"
TP_SOCKET_IFNAME = "enp1s0f1np1"
NCCL_IGNORE_CPU_AFFINITY = "1"
NCCL_DEBUG = "WARN"
NCCL_CUMEM_ENABLE = "0"

# ---------------------------------------------------------------------------
# Model A — DeepSeek-V4-Flash (Aiden GB10 image, native 1M YaRN)
# ---------------------------------------------------------------------------
[models.ds4]
aliases = ["deepseek", "deepseek-v4-flash", "ds"]
label = "DeepSeek-V4-Flash"
image = "aidendle94/sparkrun-vllm-ds4-gb10:production-ready"
hf_id = "deepseek-ai/DeepSeek-V4-Flash"
served_name = "deepseek-v4-flash"
wrapper = "dsv4"  # bash -lc exec /usr/local/bin/dsv4-vllm-entrypoint serve
hf_mount = "/cache/huggingface"
drop_caches = true
gpu_memory_utilization = 0.85
max_model_len = 1048576
max_num_seqs = 2
hermes_provider = "spark"
hermes_context_length = 1048576
notes = "KV fp8 OK. MTP 2. Do not cap at 32k."

[models.ds4.env]
HF_HOME = "/cache/huggingface"
HF_HUB_OFFLINE = "1"
VLLM_CACHE_ROOT = "/cache/huggingface/vllm-cache"
VLLM_ALLOW_LONG_MAX_MODEL_LEN = "1"
VLLM_USE_B12X_MOE = "1"
VLLM_SPARSE_INDEXER_MAX_LOGITS_MB = "256"
VLLM_ENFORCE_STRICT_TOOL_CALLING = "0"
VLLM_NCCL_SO_PATH = "/opt/env/lib/python3.12/site-packages/nvidia/nccl/lib/libnccl.so.2"
TORCH_CUDA_ARCH_LIST = "12.1a"
FLASHINFER_CUDA_ARCH_LIST = "12.1a"
# Same right-port rails as cluster.nccl (enp1s0f1). Do not switch back to f0.
UCX_NET_DEVICES = "rocep1s0f1:1,roceP2p1s0f1:1"

[models.ds4.vllm]
# Flags after `serve <hf_id>`. Rank/master/headless are injected by the CLI.
args = [
  "--served-model-name", "deepseek-v4-flash",
  "--host", "0.0.0.0",
  "--port", "8000",
  "--trust-remote-code",
  "--tensor-parallel-size", "2",
  "--pipeline-parallel-size", "1",
  "--kv-cache-dtype", "fp8",
  "--block-size", "256",
  "--max-model-len", "1048576",
  "--max-num-seqs", "2",
  "--max-num-batched-tokens", "8192",
  "--gpu-memory-utilization", "0.85",
  "--enable-prefix-caching",
  "--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":2}",
  "--tokenizer-mode", "deepseek_v4",
  "--tool-call-parser", "deepseek_v4",
  "--enable-auto-tool-choice",
  "--reasoning-parser", "deepseek_v4",
  "--enable-flashinfer-autotune",
]

# ---------------------------------------------------------------------------
# Model B — Qwen3.8-Flash-Next-FP8 (official vLLM recipe, native 262k)
# ---------------------------------------------------------------------------
[models.qwen]
aliases = ["qwen38", "qwen3.8", "qwen3.8-flash-next", "qwen-fp8"]
label = "Qwen3.8-Flash-Next-FP8"
image = "vllm/vllm-openai:qwen38-flash-next"
hf_id = "Qwen/Qwen3.8-Flash-Next-FP8"
served_name = "qwen3.8-flash-next"
wrapper = "vllm"  # image ENTRYPOINT is already `vllm serve`
hf_mount = "/root/.cache/huggingface"
drop_caches = true
gpu_memory_utilization = 0.82
max_model_len = 262144
max_num_seqs = 2
hermes_provider = "spark"
hermes_context_length = 262144
notes = "enforce-eager required. No PLE CPU offload with nnodes=2. Do not set kv-cache-dtype fp8."
docker_extra = ["--cap-add", "SYS_NICE", "--ulimit", "memlock=-1"]

[models.qwen.env]
HF_HOME = "/root/.cache/huggingface"
HF_HUB_OFFLINE = "1"
HF_HUB_DISABLE_IMPLICIT_TOKEN = "1"
VLLM_ALLOW_LONG_MAX_MODEL_LEN = "1"

[models.qwen.vllm]
args = [
  "--served-model-name", "qwen3.8-flash-next",
  "--host", "0.0.0.0",
  "--port", "8000",
  "--trust-remote-code",
  "--tensor-parallel-size", "2",
  "--pipeline-parallel-size", "1",
  "--dtype", "auto",
  "--kv-cache-dtype", "auto",
  "--max-model-len", "262144",
  "--max-num-seqs", "2",
  "--gpu-memory-utilization", "0.82",
  "--enforce-eager",
  "--compilation-config", "{\"mode\":0}",
  "--enable-prefix-caching",
  "--enable-chunked-prefill",
  "--no-enable-flashinfer-autotune",
  "--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":3}",
  "--enable-auto-tool-choice",
  "--tool-call-parser", "qwen3_xml",
  "--reasoning-parser", "qwen3",
]
