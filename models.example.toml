# spark-serve catalog — copy to models.toml and edit [cluster].
# models.toml is gitignored so LAN IPs and SSH hostnames stay off GitHub.
# Cluster fabric is shared. Do not retune NCCL here unless the cable moves.

[cluster]
head = "spark-head"
worker = "spark-worker"
# QSFP / RoCE IP of the head (not the LAN NIC). NVIDIA Spark pairs often use 192.168.100.10.
master_addr = "192.168.100.10"
master_port = 29501
nnodes = 2
# Default --tensor-parallel-size when a model omits the flag.
tensor_parallel = 2
port = 8000
lan_url = "http://192.168.1.10:8000"
worker_lan_url = "http://spark-worker.lan:8000"
hf_cache_host = "/home/YOU/.cache/huggingface"
container = "vllm_cluster"
executor = "mp"
ssh_opts = ["-o", "BatchMode=yes", "-o", "ConnectTimeout=8"]
keep_containers = []
stop_names = ["vllm_cluster", "vllm_mimo"]

# Independent YuE song/take workers (requires Artist Twin protocol-v2 factory).
# Host names here must resolve from the Mac; SSH aliases need not resolve in HTTP.
[yue]
head_url = "http://spark-head.lan:8011"
worker_url = "http://spark-worker.lan:8011"
service = "yue-icl.service"
factory_root = "~/.local/share/artist-twin/yue-factory"
port = 8011
ready_timeout = 180

[cluster.nccl]
# Right-port QSFP rails (enp1s0f1 / enP2p1s0f1). Do not switch back to f0.
NCCL_IB_DISABLE = "0"
NCCL_IB_HCA = "=rocep1s0f1,roceP2p1s0f1"
NCCL_IB_GID_INDEX = "3"
NCCL_IB_MERGE_NICS = "1"
NCCL_CROSS_NIC = "1"
NCCL_NET_PLUGIN = "none"
NCCL_NET = "IB"
NCCL_SOCKET_IFNAME = "enp1s0f1np1"
GLOO_SOCKET_IFNAME = "enp1s0f1np1"
TP_SOCKET_IFNAME = "enp1s0f1np1"
NCCL_IGNORE_CPU_AFFINITY = "1"
NCCL_DEBUG = "WARN"
NCCL_CUMEM_ENABLE = "0"

# ---------------------------------------------------------------------------
# Model A — DeepSeek-V4-Flash (Aiden GB10 image, native 1M YaRN)
# ---------------------------------------------------------------------------
[models.ds4]
# Explicit pinned-memory allowance; see docs/ds4-startup-recovery.md.
docker_extra = ["--ulimit", "memlock=-1:-1"]
aliases = ["deepseek", "deepseek-v4-flash", "ds"]
label = "DeepSeek-V4-Flash"
image = "aidendle94/sparkrun-vllm-ds4-gb10:production-ready"
hf_id = "deepseek-ai/DeepSeek-V4-Flash"
served_name = "deepseek-v4-flash"
wrapper = "dsv4"  # bash -lc exec /usr/local/bin/dsv4-vllm-entrypoint serve
hf_mount = "/cache/huggingface"
drop_caches = true
gpu_memory_utilization = 0.85
max_model_len = 1048576
max_num_seqs = 2
hermes_provider = "spark"
hermes_context_length = 1048576
notes = "KV fp8 OK. MTP 2. Do not cap at 32k."

[models.ds4.env]
# RDMA via [cluster.nccl]. On kernel 7.0.0-1019 this needs kho=off on both
# Sparks (docs/ds4-startup-recovery.md); without it fall back to NCCL_NET = "Socket".
NCCL_NET = "IB"
NCCL_IB_DISABLE = "0"
NCCL_DEBUG = "INFO"
NCCL_NVLS_ENABLE = "0"
HF_HOME = "/cache/huggingface"
HF_HUB_OFFLINE = "1"
VLLM_CACHE_ROOT = "/cache/huggingface/vllm-cache"
VLLM_ALLOW_LONG_MAX_MODEL_LEN = "1"
VLLM_USE_B12X_MOE = "1"
VLLM_SPARSE_INDEXER_MAX_LOGITS_MB = "256"
VLLM_ENFORCE_STRICT_TOOL_CALLING = "0"
VLLM_NCCL_SO_PATH = "/opt/env/lib/python3.12/site-packages/nvidia/nccl/lib/libnccl.so.2"
TORCH_CUDA_ARCH_LIST = "12.1a"
FLASHINFER_CUDA_ARCH_LIST = "12.1a"
# Same right-port rails as cluster.nccl (enp1s0f1). Do not switch back to f0.
UCX_NET_DEVICES = "rocep1s0f1:1,roceP2p1s0f1:1"

[models.ds4.vllm]
# Flags after `serve <hf_id>`. Rank/master/headless are injected by the CLI.
args = [
  "--served-model-name", "deepseek-v4-flash",
  "--host", "0.0.0.0",
  "--port", "8000",
  "--trust-remote-code",
  "--tensor-parallel-size", "2",
  "--pipeline-parallel-size", "1",
  "--kv-cache-dtype", "fp8",
  "--block-size", "256",
  "--max-model-len", "1048576",
  "--max-num-seqs", "2",
  "--max-num-batched-tokens", "8192",
  "--gpu-memory-utilization", "0.85",
  "--enable-prefix-caching",
  "--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":2}",
  "--tokenizer-mode", "deepseek_v4",
  "--tool-call-parser", "deepseek_v4",
  "--enable-auto-tool-choice",
  "--reasoning-parser", "deepseek_v4",
  "--enable-flashinfer-autotune",
]

