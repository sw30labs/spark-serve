# spark-serve catalog — copy to models.toml and edit [cluster].
# models.toml is gitignored so LAN IPs and SSH hostnames stay off GitHub.
# Cluster fabric is shared. Do not retune NCCL here unless the cable moves.

[cluster]
head = "spark-head"
worker = "spark-worker"
# QSFP / RoCE IP of the head (not the LAN NIC). NVIDIA Spark pairs often use 192.168.100.10.
master_addr = "192.168.100.10"
master_port = 29501
nnodes = 2
# Default --tensor-parallel-size when a model omits the flag.
tensor_parallel = 2
port = 8000
lan_url = "http://192.168.1.10:8000"
worker_lan_url = "http://spark-worker.lan:8000"
hf_cache_host = "/home/YOU/.cache/huggingface"
container = "vllm_cluster"
executor = "mp"
ssh_opts = ["-o", "BatchMode=yes", "-o", "ConnectTimeout=8"]
keep_containers = []
stop_names = ["vllm_cluster", "vllm_mimo", "vllm_qwen38_v030", "tensorfold_qwen38", "vllm_dsv41_exl3"]

# Independent YuE song/take workers (requires Artist Twin protocol-v2 factory).
# Host names here must resolve from the Mac; SSH aliases need not resolve in HTTP.
[yue]
head_url = "http://spark-head.lan:8011"
worker_url = "http://spark-worker.lan:8011"
service = "yue-icl.service"
factory_root = "~/.local/share/artist-twin/yue-factory"
port = 8011
ready_timeout = 180

[cluster.nccl]
# Right-port QSFP rails (enp1s0f1 / enP2p1s0f1). Do not switch back to f0.
NCCL_IB_DISABLE = "0"
NCCL_IB_HCA = "=rocep1s0f1,roceP2p1s0f1"
NCCL_IB_GID_INDEX = "3"
NCCL_IB_MERGE_NICS = "1"
NCCL_CROSS_NIC = "1"
NCCL_NET_PLUGIN = "none"
NCCL_NET = "IB"
NCCL_SOCKET_IFNAME = "enp1s0f1np1"
GLOO_SOCKET_IFNAME = "enp1s0f1np1"
TP_SOCKET_IFNAME = "enp1s0f1np1"
NCCL_IGNORE_CPU_AFFINITY = "1"
NCCL_DEBUG = "WARN"
NCCL_CUMEM_ENABLE = "0"

# DeepSeek-V4.1-Flash EXL3 2.9bpw — two-Spark vLLM trial.
# Prepare: ./spark-serve pull ds41-exl3
# Start: ./spark-serve up ds41-exl3 --no-hermes
[models.ds41-exl3]
aliases = ["dsv41", "ds41", "deepseek-v41"]
label = "DeepSeek-v4.1-Flash EXL3"
image = "spark-serve-dsv41-exl3:0.1.0"
recipe = "dsv41-exl3"
hf_id = "Mia-AiLab/DeepSeek-V4.1-Flash-EXL3-2.9bpw"
serve_path = "/cache/huggingface/spark-serve/dsv41-exl3/models/target/64ba41b6c916a587db06eae2e19b7845f7be6e6b"
served_name = "DeepSeek-v4.1-Flash-EXL3"
quant = "EXL3 2.9bpw"
quant_bits = 2.9
quant_scope = "all"
quant_detail = "EXL3 at 2.9 bpw average, non-expert layers included (head 6 bpw, MTP 4 bpw), requantized from the official FP4/FP8 checkpoint."
wrapper = "vllm"
container = "vllm_dsv41_exl3"
nnodes = 2
tensor_parallel = 2
hf_mount = "/cache/huggingface"
drop_caches = true
shm_size = "32g"
docker_extra = ["--ulimit", "memlock=-1:-1", "--ulimit", "stack=67108864", "--cap-add", "IPC_LOCK", "--oom-score-adj", "1000", "--stop-timeout", "60"]
ready_timeout = 3600
preflight_timeout = 3600
max_model_len = 600000
max_num_seqs = 2
gpu_memory_utilization = 0.88
hermes_provider = "spark"
hermes_context_length = 600000
hermes_supports_vision = true
host_ip_head = "192.168.100.10"
host_ip_worker = "192.168.100.11"
preflight_args = ["/opt/spark-serve/dsv41-exl3/verify.py", "/cache/huggingface/spark-serve/dsv41-exl3", "--expected-manifest-sha256", "fa38940c6e221778a6f4140b84a6f526fde9cdac4898f3b02835793a31914a9a"]
notes = "Two Sparks. EXL3 2.9bpw, DSpark k3, vision on, 600k context. Pull fetches about 385 GiB on the head and copies it to the worker. Local qualification pending."

[[models.ds41-exl3.mounts]]
container = "/engram-src"
head = "/home/YOU/.cache/huggingface/spark-serve/dsv41-exl3/models/engram/2cba9e42aa026125f3ed06c6d98c1db82f7ca027"
worker = "/home/YOU/.cache/huggingface/spark-serve/dsv41-exl3/models/engram/2cba9e42aa026125f3ed06c6d98c1db82f7ca027"
readonly = true

[models.ds41-exl3.env]
HF_HOME = "/cache/huggingface"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
VLLM_CACHE_ROOT = "/cache/huggingface/spark-serve/dsv41-exl3/runtime-cache/vllm"
XDG_CACHE_HOME = "/cache/huggingface/spark-serve/dsv41-exl3/runtime-cache"
