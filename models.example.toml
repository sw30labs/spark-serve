# spark-serve catalog — copy to models.toml and edit [cluster].
# models.toml is gitignored so LAN IPs and SSH hostnames stay off GitHub.
# Cluster fabric is shared. Do not retune NCCL here unless the cable moves.

[cluster]
head = "spark-head"
worker = "spark-worker"
# QSFP / RoCE IP of the head (not the LAN NIC). NVIDIA Spark pairs often use 192.168.100.10.
master_addr = "192.168.100.10"
master_port = 29501
nnodes = 2
# Default --tensor-parallel-size when a model omits the flag.
tensor_parallel = 2
port = 8000
lan_url = "http://192.168.1.10:8000"
worker_lan_url = "http://spark-worker.lan:8000"
hf_cache_host = "/home/YOU/.cache/huggingface"
container = "vllm_cluster"
executor = "mp"
ssh_opts = ["-o", "BatchMode=yes", "-o", "ConnectTimeout=8"]
keep_containers = []
stop_names = ["vllm_cluster"]

# Independent YuE song/take workers (requires Artist Twin protocol-v2 factory).
# Host names here must resolve from the Mac; SSH aliases need not resolve in HTTP.
[yue]
head_url = "http://spark-head.lan:8011"
worker_url = "http://spark-worker.lan:8011"
service = "yue-icl.service"
factory_root = "~/.local/share/artist-twin/yue-factory"
port = 8011
ready_timeout = 180

[cluster.nccl]
# Right-port QSFP rails (enp1s0f1 / enP2p1s0f1). Do not switch back to f0.
NCCL_IB_DISABLE = "0"
NCCL_IB_HCA = "=rocep1s0f1,roceP2p1s0f1"
NCCL_IB_GID_INDEX = "3"
NCCL_IB_MERGE_NICS = "1"
NCCL_CROSS_NIC = "1"
NCCL_NET_PLUGIN = "none"
NCCL_NET = "IB"
NCCL_SOCKET_IFNAME = "enp1s0f1np1"
GLOO_SOCKET_IFNAME = "enp1s0f1np1"
TP_SOCKET_IFNAME = "enp1s0f1np1"
NCCL_IGNORE_CPU_AFFINITY = "1"
NCCL_DEBUG = "WARN"
NCCL_CUMEM_ENABLE = "0"

# ---------------------------------------------------------------------------
# Model A — DeepSeek-V4-Flash (Aiden GB10 image, native 1M YaRN)
# ---------------------------------------------------------------------------
[models.ds4]
# Explicit pinned-memory allowance; see docs/ds4-startup-recovery.md.
docker_extra = ["--ulimit", "memlock=-1:-1"]
aliases = ["deepseek", "deepseek-v4-flash", "ds"]
label = "DeepSeek-V4-Flash"
image = "aidendle94/sparkrun-vllm-ds4-gb10:production-ready"
hf_id = "deepseek-ai/DeepSeek-V4-Flash"
served_name = "deepseek-v4-flash"
wrapper = "dsv4"  # bash -lc exec /usr/local/bin/dsv4-vllm-entrypoint serve
hf_mount = "/cache/huggingface"
drop_caches = true
gpu_memory_utilization = 0.85
max_model_len = 1048576
max_num_seqs = 2
hermes_provider = "spark"
hermes_context_length = 1048576
notes = "KV fp8 OK. MTP 2. Do not cap at 32k."

[models.ds4.env]
# Verified recovery for GB10 RDMA long-term page migration failures.
# Socket transport still uses the fast right-port QSFP interfaces.
# Remove these model overrides only after validating a native RDMA remedy.
NCCL_NET = "Socket"
NCCL_IB_DISABLE = "1"
NCCL_SOCKET_IFNAME = "=enp1s0f1np1,enP2p1s0f1np1"
NCCL_SOCKET_NTHREADS = "2"
NCCL_NSOCKS_PERTHREAD = "4"
NCCL_BUFFSIZE = "1048576"
NCCL_MAX_NCHANNELS = "8"
NCCL_DEBUG = "INFO"
NCCL_NVLS_ENABLE = "0"
HF_HOME = "/cache/huggingface"
HF_HUB_OFFLINE = "1"
VLLM_CACHE_ROOT = "/cache/huggingface/vllm-cache"
VLLM_ALLOW_LONG_MAX_MODEL_LEN = "1"
VLLM_USE_B12X_MOE = "1"
VLLM_SPARSE_INDEXER_MAX_LOGITS_MB = "256"
VLLM_ENFORCE_STRICT_TOOL_CALLING = "0"
VLLM_NCCL_SO_PATH = "/opt/env/lib/python3.12/site-packages/nvidia/nccl/lib/libnccl.so.2"
TORCH_CUDA_ARCH_LIST = "12.1a"
FLASHINFER_CUDA_ARCH_LIST = "12.1a"
# Same right-port rails as cluster.nccl (enp1s0f1). Do not switch back to f0.
UCX_NET_DEVICES = "rocep1s0f1:1,roceP2p1s0f1:1"

[models.ds4.vllm]
# Flags after `serve <hf_id>`. Rank/master/headless are injected by the CLI.
args = [
  "--served-model-name", "deepseek-v4-flash",
  "--host", "0.0.0.0",
  "--port", "8000",
  "--trust-remote-code",
  "--tensor-parallel-size", "2",
  "--pipeline-parallel-size", "1",
  "--kv-cache-dtype", "fp8",
  "--block-size", "256",
  "--max-model-len", "1048576",
  "--max-num-seqs", "2",
  "--max-num-batched-tokens", "8192",
  "--gpu-memory-utilization", "0.85",
  "--enable-prefix-caching",
  "--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":2}",
  "--tokenizer-mode", "deepseek_v4",
  "--tool-call-parser", "deepseek_v4",
  "--enable-auto-tool-choice",
  "--reasoning-parser", "deepseek_v4",
  "--enable-flashinfer-autotune",
]

# ---------------------------------------------------------------------------
# Model B — DeepSeek-V4-Flash-0731 + FlyCockpit vision (Anemll + plugin)
# Flip with: ./spark-serve up ds4-vision
# Flip back:  ./spark-serve up ds4
# Agent contract: thinking false on image turns; see docs/ds4-vision.md
# ---------------------------------------------------------------------------
[models.ds4-vision]
aliases = ["ds4v", "deepseek-vision", "0731-vision", "flycockpit"]
label = "DeepSeek-V4-Flash-0731 Vision"
image = "dsv4-vision-vllm:0.1.1"
hf_id = "deepseek-ai/DeepSeek-V4-Flash-0731"
serve_path = "/cache/huggingface/dsv4-0731-vision"
served_name = "deepseek-v4-flash-0731-vision"
wrapper = "dsv4-vision"
hf_mount = "/cache/huggingface"
drop_caches = true
shm_size = "64g"
gpu_memory_utilization = 0.80
max_model_len = 131072
max_num_seqs = 4
hermes_provider = "spark"
hermes_context_length = 131072
host_ip_head = "192.168.100.10"
host_ip_worker = "192.168.100.11"
notes = "Requires 0731 weights + FlyCockpit tower/adapter + built dsv4-vision-vllm:0.1.1. Stops text ds4 on same :8000."

[[models.ds4-vision.mounts]]
head = "/home/spider/REPOS/DeepSeek-V4-Vision-2x-DGX-Sparks/plugin"
worker = "/home/spider/REPOS/DeepSeek-V4-Vision-2x-DGX-Sparks/plugin"
container = "/opt/dsv4-vision-plugin"

[[models.ds4-vision.mounts]]
head = "/home/spider/.cache/huggingface/vision/tower"
worker = "/home/spider/.cache/huggingface/vision/tower"
container = "/tower"
ro = true

[[models.ds4-vision.mounts]]
head = "/home/spider/.cache/huggingface/vision/adapter"
worker = "/home/spider/.cache/huggingface/vision/adapter"
container = "/ckpt"
ro = true

[models.ds4-vision.env]
HF_HOME = "/cache/huggingface"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
VLLM_CACHE_ROOT = "/cache/huggingface/vllm-cache"
VLLM_ALLOW_LONG_MAX_MODEL_LEN = "1"
VLLM_USE_B12X_MOE = "1"
VLLM_SPARSE_INDEXER_MAX_LOGITS_MB = "256"
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "0"
VLLM_USE_FLASHINFER_SAMPLER = "1"
TORCH_CUDA_ARCH_LIST = "12.1a"
FLASHINFER_CUDA_ARCH_LIST = "12.1a"
FLASHINFER_DISABLE_VERSION_CHECK = "1"
DSV4_VISION_TOWER = "/tower/deepencoder_v2_tower.safetensors"
DSV4_VISION_ADAPTER = "/ckpt/latest.pt"
NCCL_NVLS_ENABLE = "0"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[models.ds4-vision.vllm]
args = [
  "--served-model-name", "deepseek-v4-flash-0731-vision",
  "--host", "0.0.0.0",
  "--port", "8000",
  "--trust-remote-code",
  "--tensor-parallel-size", "2",
  "--pipeline-parallel-size", "1",
  "--kv-cache-dtype", "nvfp4_ds_mla",
  "--block-size", "256",
  "--max-model-len", "131072",
  "--max-num-seqs", "4",
  "--max-num-batched-tokens", "8192",
  "--gpu-memory-utilization", "0.80",
  "--enforce-eager",
  "--limit-mm-per-prompt", "{\"image\":8}",
  "--tokenizer-mode", "deepseek_v4",
  "--moe-backend", "flashinfer_b12x",
  "--generation-config", "vllm",
  "--trust-request-chat-template",
]


# ---------------------------------------------------------------------------
# Model C — Nemotron-3-Super-120B NVFP4 (official vLLM single-Spark recipe)
# Independent worker: ./spark-serve up nemotron-super --node worker
# Prepare that node first: ./spark-serve pull nemotron-super --node worker
# Playbook: docs/nemotron-super.md. TP1; leaves the other node's model running.
# ---------------------------------------------------------------------------
[models.nemotron-super]
aliases = ["nemotron-super", "nemotron3-super", "n3s"]
label = "Nemotron-3-Super-120B NVFP4"
image = "spark-serve-nemotron-super-nvfp4:0.1.0"
recipe = "nemotron-super-nvfp4"
hf_id = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
serve_path = "/cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4/snapshots/ff433f5493e25d631c9f12b5d55c674229923d02"
served_name = "nemotron-3-super"
wrapper = "vllm"
nnodes = 1
tensor_parallel = 1
hf_mount = "/cache/huggingface"
drop_caches = true
shm_size = "32g"
docker_extra = ["--ulimit", "memlock=-1:-1"]
ready_timeout = 3600
max_model_len = 262144
max_num_seqs = 8
gpu_memory_utilization = 0.80
hermes_provider = "spark"
hermes_context_length = 262144
preflight_args = ["/opt/spark-serve/nemotron-super/verify.py", "/cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4/snapshots/ff433f5493e25d631c9f12b5d55c674229923d02"]
notes = "NVIDIA NVFP4. Independent single Spark, 262K context, reasoning + tools, MTP 3. Pinned vLLM 0.28.0; FP32 Mamba state."

[models.nemotron-super.env]
HF_HOME = "/cache/huggingface"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
VLLM_CACHE_ROOT = "/cache/huggingface/nemotron-super-vllm-cache"
XDG_CACHE_HOME = "/cache/huggingface/nemotron-super-runtime-cache"
FLASHINFER_WORKSPACE_BASE = "/cache/huggingface/nemotron-super-runtime-cache"
TRITON_CACHE_DIR = "/cache/huggingface/nemotron-super-runtime-cache/triton"
TORCH_EXTENSIONS_DIR = "/cache/huggingface/nemotron-super-runtime-cache/torch_extensions"
CUDA_CACHE_PATH = "/cache/huggingface/nemotron-super-runtime-cache/cuda"
NCCL_NET = "Socket"
NCCL_IB_DISABLE = "1"
CUTE_DSL_ARCH = "sm_121a"
TORCH_CUDA_ARCH_LIST = "12.1a"
FLASHINFER_CUDA_ARCH_LIST = "12.1a"
VLLM_FLOAT32_MATMUL_PRECISION = "high"
VLLM_ALLOW_LONG_MAX_MODEL_LEN = "1"

[models.nemotron-super.vllm]
# Pinned vLLM recipe; native ModelOpt and MoE backend selection.
args = [
  "--served-model-name", "nemotron-3-super",
  "--host", "0.0.0.0",
  "--port", "8000",
  "--tensor-parallel-size", "1",
  "--max-model-len", "262144",
  "--gpu-memory-utilization", "0.80",
  "--max-num-seqs", "8",
  "--load-format", "fastsafetensors",
  "--attention-backend", "flashinfer",
  "--max-num-batched-tokens", "16384",
  "--kv-cache-dtype", "fp8",
  "--mamba-cache-mode", "align",
  "--mamba-ssm-cache-dtype", "float32",
  "--speculative-config", '{"method":"mtp","num_speculative_tokens":3}',
  "--enable-prefix-caching",
  "--reasoning-parser", "nemotron_v3",
  "--enable-auto-tool-choice",
  "--tool-call-parser", "qwen3_xml",
]

